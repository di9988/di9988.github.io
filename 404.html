<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面未找到 · 王东 Dong Wang</title>
<style>
  :root{ --brand:#123a5a; --accent:#0e9488; --muted:#5d7085; --border:#e2e8ef; }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#f4f6f9; color:#1b2733; text-align:center; padding:24px;
    font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .box{
    background:#fff; border:1px solid var(--border); border-radius:14px;
    padding:40px 36px; max-width:460px; box-shadow:0 8px 24px rgba(16,32,48,.06);
  }
  .code{font-size:3rem; font-weight:800; color:var(--brand); margin:0}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:8px}
  h1{font-size:1.25rem; margin:8px 0 6px}
  p{color:var(--muted); font-size:.95rem; margin:0 0 22px}
  a{
    display:inline-block; padding:10px 20px; border-radius:10px; background:var(--brand);
    color:#fff; font-weight:700; font-size:.9rem; text-decoration:none;
  }
  a:hover{opacity:.9}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1><span class="dot"></span>页面走丢了</h1>
    <p>你访问的页面不存在或已移动。</p>
    <a href="/">返回主页</a>
  </div>
</body>
</html>
